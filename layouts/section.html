{{ define "stager" }}
<main>
    <div id="breadcrumb" class="container">
        {{ partial "breadcrumb.html" . }}
    </div>
    <div id="masonry" class="container">
        <div class="masonry">
        {{ range .Pages }}
            <div class="masonry-item">
                {{ with .Params.thumbnail }}
                        <img src="{{.}}">
                {{ end }}
                <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
                <p>{{.Summary}}</p>
            </div>
        {{ end }}
        </div>
    </div>
</main>
<aside>
    <p>aside</p>
</aside>
{{ end }}
